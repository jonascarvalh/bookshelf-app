name: book_app
description: "Estante — app para organizar leituras com a API da Open Library, offline-first e leitor de código de barras."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  equatable: ^3.0.0
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_timezone: ^5.1.1
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^18.1.1
  intl: ^0.20.3
  json_annotation: ^4.12.0
  mobile_scanner: ^7.4.2
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.15.2
  drift_dev: ^2.35.2
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
